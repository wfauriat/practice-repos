[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cli-typer"
version = "0.1.0"
description = "Typer + Rich CLI scaffold"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
mycli = "mycli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
