services:
  api:
    build: .
    image: python-fastapi-crud
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/app.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
